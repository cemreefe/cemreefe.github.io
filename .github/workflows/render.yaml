name: Render with SimplyMarkdown

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install SimplyMarkdown v2
        run: >-
          python -m pip install
          "simplymarkdown @ git+https://github.com/cemreefe/SimplyMarkdown@fa3f20288706f4f1bab37ac96177f6f4d4fad6d9"
      - name: Build
        run: >-
          simplymarkdown
          --input source
          --output public
          --root https://cemrekarakas.com
          --title "Cemre's Blog"
          --css source/static/css/modern.css
          --template source/_templates/base.html
          --favicon 🪴
          --rss-whitelist '/posts/*,/tr/posts/*'
      - name: Check out the GitHub Pages branch
        run: >-
          git clone
          --branch gh-pages
          "https://github.com/${{ github.repository }}"
          "${{ runner.temp }}/gh-pages"
      - name: Replace the published site
        run: |
          cd "${{ runner.temp }}/gh-pages"
          git rm -r --ignore-unmatch .
          cp -a "${{ github.workspace }}/public/." .
      - name: Publish
        env:
          RENDER_MESSAGE: ${{ github.event.head_commit.message || 'manual run' }}
        run: |
          cd "${{ runner.temp }}/gh-pages"
          git config user.name '${{ github.actor }}'
          git config user.email '${{ github.actor }}@users.noreply.github.com'
          git remote set-url origin "https://x-access-token:${{ secrets.AUTO_RENDER_PAT }}@github.com/${{ github.repository }}"
          git add -A
          if git diff --cached --quiet; then
            echo "No rendered changes to publish."
            exit 0
          fi
          git commit -m "Rendered by SimplyMarkdown v2 - ${RENDER_MESSAGE}"
          git push
