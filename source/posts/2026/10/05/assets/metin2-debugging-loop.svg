<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Metin2 port debugging loop</title>
  <desc id="desc">A repeatable debugging sequence: capture symptom, locate boundary, instrument, repair contract, and rerun a minimal scenario.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#222"/></marker>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #222; }
      .h { font-size: 25px; font-weight: 700; } .l { font-size: 17px; font-weight: 700; } .s { font-size: 14px; }
      .box { fill: #fff; stroke: #222; stroke-width: 2; } .line { fill: none; stroke: #222; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="500" fill="#fff"/>
  <text x="55" y="52" class="h">Boundary-first debugging loop</text><text x="55" y="78" class="s">the visible failure narrows the search; the contract is repaired at the responsible boundary</text>
  <rect x="70" y="170" width="190" height="115" class="box"/><text x="112" y="212" class="l">1. Capture</text><text x="100" y="242" class="s">screen / log / packet</text><text x="100" y="264" class="s">black screen, offset</text>
  <rect x="330" y="170" width="190" height="115" class="box"/><text x="372" y="212" class="l">2. Locate</text><text x="360" y="242" class="s">lifecycle, API, data</text><text x="360" y="264" class="s">or protocol boundary</text>
  <rect x="590" y="170" width="190" height="115" class="box"/><text x="632" y="212" class="l">3. Instrument</text><text x="620" y="242" class="s">trace first divergence</text><text x="620" y="264" class="s">not downstream noise</text>
  <rect x="850" y="170" width="280" height="115" class="box"/><text x="910" y="212" class="l">4. Repair contract</text><text x="885" y="242" class="s">thread, packet field, UV,</text><text x="885" y="264" class="s">state, geometry, lifecycle</text>
  <path d="M260 227H320" class="line"/><path d="M520 227H580" class="line"/><path d="M780 227H840" class="line"/><path d="M990 285V380H165V295" class="line"/>
  <text x="335" y="420" class="s">5. Rerun the smallest scenario that crosses the same boundary</text>
</svg>
