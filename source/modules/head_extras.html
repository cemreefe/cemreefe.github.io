<!-- Apply the saved colour theme before paint. -->
<script>
  (function() {
    var stored = localStorage.getItem('theme');
    var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (stored === 'dark' || (!stored && prefersDark)) {
      document.documentElement.classList.add('dark');
    }
  })();
</script>

<!-- Linkable article headings. -->
<script>
  document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('main h2[id], main h3[id], main h4[id]').forEach(function(heading) {
      heading.addEventListener('click', function() {
        history.pushState(null, '', window.location.href.split('#')[0] + '#' + heading.id);
        heading.scrollIntoView({ behavior: 'smooth' });
      });
    });
  });
</script>

<!-- Navigation state. -->
<script>
  document.addEventListener('DOMContentLoaded', function() {
    var pagePath = window.location.pathname.replace(/\/$/, '') || '/';
    document.querySelectorAll('.site-nav a').forEach(function(link) {
      var linkUrl = new URL(link.href, window.location.href);
      var linkPath = linkUrl.pathname.replace(/\/$/, '') || '/';
      var isArticleLink = linkPath === '/blog' && pagePath.indexOf('/posts/') === 0;
      if (!linkUrl.hash && (linkPath === pagePath || isArticleLink)) {
        link.classList.add('nav-current');
      }
    });
  });
</script>

<!-- Colour theme toggle. -->
<script>
  document.addEventListener('DOMContentLoaded', function() {
    var button = document.getElementById('theme-toggle');
    if (!button) return;

    function updateLabel() {
      var dark = document.documentElement.classList.contains('dark');
      var label = dark ? 'Use light theme' : 'Use dark theme';
      button.setAttribute('aria-label', label);
      button.setAttribute('title', label);
    }

    updateLabel();
    button.addEventListener('click', function() {
      var dark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', dark ? 'dark' : 'light');
      updateLabel();
    });
  });
</script>
