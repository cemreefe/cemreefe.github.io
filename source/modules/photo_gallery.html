<script>
  document.addEventListener('DOMContentLoaded', function () {
    var lightbox = document.getElementById('galleryLightbox');
    if (!lightbox) return;
    var lightboxImg = lightbox.querySelector('.galleryLightbox-img');
    var closeBtn = lightbox.querySelector('.galleryLightbox-close');
    function close() {
      lightbox.classList.remove('galleryLightbox--open');
      lightbox.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
    }
    document.querySelectorAll('.photoMarquee-track img').forEach(function (img) {
      img.addEventListener('click', function () {
        lightboxImg.src = img.src;
        lightbox.classList.add('galleryLightbox--open');
        lightbox.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
      });
    });
    closeBtn.addEventListener('click', close);
    lightbox.addEventListener('click', function (e) { if (e.target === lightbox) close(); });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && lightbox.classList.contains('galleryLightbox--open')) close();
    });
  });
</script>
