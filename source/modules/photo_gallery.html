<section class="photo-journal" id="photographs" aria-labelledby="photographs-title">
  <header class="photo-journal-head">
    <div>
      <p class="eyebrow">Photographic notes</p>
      <h2 id="photographs-title">Things that made me stop walking.</h2>
    </div>
    <p>Unpolished fragments from streets, workshops, concerts and places in between. Click any shape to look closer.</p>
  </header>

  <div class="photo-collage">
    <button class="photo-tile" type="button" data-caption="A wet street in Istanbul after dark." aria-label="Open photograph: a wet street in Istanbul after dark">
      <img src="/static/images/gallery/10.jpg" alt="Two people passing small illuminated shops on a wet street at night" width="1080" height="1080" loading="lazy" decoding="async">
    </button>
    <button class="photo-tile" type="button" data-caption="Found language, somewhere in Paris." aria-label="Open photograph: Kurdish and Turkish restaurant sign">
      <img src="/static/images/gallery/21.jpg" alt="A restaurant sign advertising Kurdish and Turkish specialities against a grey sky" width="936" height="935" loading="lazy" decoding="async">
    </button>
    <button class="photo-tile" type="button" data-caption="Blue light, loud room." aria-label="Open photograph: hand reaching into blue light">
      <img src="/static/images/gallery/28.jpg" alt="A hand reaching toward suspended spheres under deep blue light" width="1080" height="1350" loading="lazy" decoding="async">
    </button>
    <button class="photo-tile" type="button" data-caption="Accidental constellations." aria-label="Open photograph: light and shadow on a wall">
      <img src="/static/images/gallery/52.jpg" alt="Grainy light, shadows and small marks forming an abstract composition on a wall" width="1080" height="1080" loading="lazy" decoding="async">
    </button>
    <button class="photo-tile" type="button" data-caption="Two small guardians." aria-label="Open photograph: a pair of small decorative elephants">
      <img src="/static/images/gallery/01.jpg" alt="Two small decorative elephants under murky green and amber light" width="1080" height="1080" loading="lazy" decoding="async">
    </button>
    <button class="photo-tile" type="button" data-caption="Machines have their own anatomy." aria-label="Open photograph: industrial extraction tubes">
      <img src="/static/images/gallery/39.jpg" alt="Large ribbed extraction tubes curving over industrial machinery" width="1080" height="1350" loading="lazy" decoding="async">
    </button>
    <button class="photo-tile" type="button" data-caption="The useful kind of ominous." aria-label="Open photograph: tsunami evacuation sign">
      <img src="/static/images/gallery/44.jpg" alt="A blue tsunami evacuation route sign framed by bare tree branches" width="1080" height="1080" loading="lazy" decoding="async">
    </button>
    <button class="photo-tile" type="button" data-caption="A tiny experiment with light." aria-label="Open photograph: glowing plasma sphere">
      <img src="/static/images/gallery/17.jpg" alt="A hand-held fluorescent tube glowing beside a plasma sphere in darkness" width="1080" height="608" loading="lazy" decoding="async">
    </button>
  </div>

  <p class="photo-journal-foot">A small edit from the archive · more photographs soon</p>

  <dialog class="gallery-dialog" id="gallery-dialog">
    <button class="gallery-dialog-close" type="button" aria-label="Close photograph">Close</button>
    <figure>
      <img src="" alt="">
      <figcaption></figcaption>
    </figure>
  </dialog>
</section>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    var dialog = document.getElementById('gallery-dialog');
    if (!dialog || typeof dialog.showModal !== 'function') return;

    var dialogImage = dialog.querySelector('img');
    var dialogCaption = dialog.querySelector('figcaption');
    var closeButton = dialog.querySelector('.gallery-dialog-close');

    document.querySelectorAll('.photo-tile').forEach(function(tile) {
      tile.addEventListener('click', function() {
        var image = tile.querySelector('img');
        dialogImage.src = image.src;
        dialogImage.alt = image.alt;
        dialogCaption.textContent = tile.dataset.caption || '';
        dialog.showModal();
      });
    });

    closeButton.addEventListener('click', function() { dialog.close(); });
    dialog.addEventListener('click', function(event) {
      if (event.target === dialog) dialog.close();
    });
  });
</script>
